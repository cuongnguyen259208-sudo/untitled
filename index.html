<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VietCuong - Three.js Particle Effect</title>

  <!-- Nhập font chữ Megrim từ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Megrim', cursive;
    }

    /* Tiêu đề VietCuong đã được chỉnh nhỏ hơn */
    #word {
      font-family: 'Megrim', cursive;
      font-size: 8vh; /* Giảm kích thước từ 20vh xuống 8vh */
      position: absolute;
      top: 15px;
      left: 15px;
      margin: 0;
      color: #fc0;
      -webkit-text-stroke: 0.08vh #fc0; /* Chỉnh lại viền chữ nhỏ hơn */
      z-index: 10;
      pointer-events: none; /* Tránh cản trở tương tác xoay 3D */
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Import map cho Three.js và OrbitControls -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Đổi chữ NOVA thành VietCuong -->
  <div id="word">VietCuong</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Khởi tạo Scene, Camera, Renderer
    let scene = new THREE.Scene();
    scene.background = new THREE.Color(0x160016);

    let camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 4, 21);

    let renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Thêm bộ điều khiển OrbitControls
    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 3. Khởi tạo dữ liệu hạt Particles
    let gu = {
      time: { value: 0 }
    };

    let pts = [];
    let sizes = [];
    let shift = [];

    let pushShift = () => {
      shift.push(
        Math.random() * Math.PI,
        Math.random() * Math.PI * 2,
        (Math.random() * 0.9 + 0.1) * Math.PI * 0.1,
        Math.random() * 0.9 + 0.1
      );
    };

    // Tạo các hạt ở quả cầu trung tâm
    for (let i = 0; i < 50000; i++) {
      let p = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 0.5 + 9.5);
      pts.push(p);
      sizes.push(Math.random() * 1.5 + 0.5);
      pushShift();
    }

    // Tạo các hạt ở vầng thiên hà bao quanh
    for (let i = 0; i < 100000; i++) {
      let r = 10;
      let R = 40;
      let rand = Math.pow(Math.random(), 1.5);
      let radius = Math.sqrt(R * R * rand + (1 - rand) * r * r);
      let p = new THREE.Vector3().setFromCylindricalCoords(
        radius,
        Math.random() * 2 * Math.PI,
        (Math.random() - 0.5) * 2
      );
      pts.push(p);
      sizes.push(Math.random() * 1.5 + 0.5);
      pushShift();
    }

    // 4. Khởi tạo Geometry và Custom Shader
    let g = new THREE.BufferGeometry().setFromPoints(pts);
    g.setAttribute('sizes', new THREE.Float32BufferAttribute(sizes, 1));
    g.setAttribute('shift', new THREE.Float32BufferAttribute(shift, 4));

    let m = new THREE.PointsMaterial({
      size: 0.125,
      transparent: true,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      onBeforeCompile: shader => {
        shader.uniforms.time = gu.time;
        shader.vertexShader = `
          uniform float time;
          attribute float sizes;
          attribute vec4 shift;
          varying vec3 vColor;
          ${shader.vertexShader}
        `.replace(
          `#include <begin_vertex>`,
          `#include <begin_vertex>
          float d = length(position) / vec3(40., 10., 40.).x;
          d = clamp(d, 0., 1.);
          vColor = mix(vec3(227., 155., 0.), vec3(100., 50., 255.), d) / 255.;
          
          float t = time;
          float move1 = mod(shift.x + shift.z * t, PI2);
          float move2 = mod(shift.y + shift.z * t, PI2);
          transformed += vec3(cos(move1), sin(move2), cos(move1) * sin(move2)) * shift.w;
          `
        ).replace(
          `gl_PointSize = size;`,
          `gl_PointSize = size * sizes;`
        );

        shader.fragmentShader = `
          varying vec3 vColor;
          ${shader.fragmentShader}
        `.replace(
          `#include <clipping_planes_fragment>`,
          `#include <clipping_planes_fragment>
          float d = length(gl_PointCoord.xy - 0.5);
          `
        ).replace(
          `vec4 diffuseColor = vec4( diffuse, opacity );`,
          `vec4 diffuseColor = vec4(vColor, smoothstep(0.5, 0.1, d) * 0.5 + 0.5);`
        );
      }
    });

    // 5. Đưa đối tượng vào Scene
    let p = new THREE.Points(g, m);
    p.rotation.order = 'ZYX';
    p.rotation.z = 0.2;
    scene.add(p);

    // 6. Vòng lặp Render & Animation
    let clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      controls.update();
      let t = clock.getElapsedTime() * 0.5;
      gu.time.value = t * Math.PI;
      p.rotation.y = t * 0.05;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
